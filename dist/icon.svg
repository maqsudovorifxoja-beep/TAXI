<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#07090d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4"/>
  
  <!-- Taxi Checkers Top -->
  <g fill="#fde047" opacity="0.85">
    <rect x="156" y="90" width="32" height="24" rx="4"/>
    <rect x="220" y="90" width="32" height="24" rx="4"/>
    <rect x="284" y="90" width="32" height="24" rx="4"/>
    <rect x="188" y="114" width="32" height="24" rx="4"/>
    <rect x="252" y="114" width="32" height="24" rx="4"/>
    <rect x="316" y="114" width="32" height="24" rx="4"/>
  </g>

  <!-- Flying Taxi Wings / Thrusters -->
  <path d="M60 270 Q160 230 230 260 L210 295 Q140 275 80 320 Z" fill="url(#cyan)" opacity="0.9"/>
  <path d="M452 270 Q352 230 282 260 L302 295 Q372 275 432 320 Z" fill="url(#cyan)" opacity="0.9"/>

  <!-- Futuristic Car Silhouette -->
  <path d="M140 330 L180 230 Q256 200 332 230 L372 330 Q256 350 140 330 Z" fill="#f8fafc"/>
  <!-- Windshield -->
  <path d="M185 240 Q256 220 327 240 L350 290 Q256 300 162 290 Z" fill="#0369a1"/>

  <!-- Headlights Glow -->
  <ellipse cx="170" cy="326" rx="22" ry="10" fill="#38bdf8"/>
  <ellipse cx="342" cy="326" rx="22" ry="10" fill="#38bdf8"/>

  <!-- TAXI sign on roof -->
  <rect x="206" y="180" width="100" height="34" rx="8" fill="url(#gold)"/>
  <text x="256" y="204" font-family="sans-serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle" letter-spacing="3">TAXI</text>

  <!-- Glowing Thruster Energy -->
  <ellipse cx="256" cy="380" rx="90" ry="18" fill="url(#cyan)" opacity="0.6"/>
  <ellipse cx="256" cy="385" rx="50" ry="8" fill="#ffffff" opacity="0.8"/>
  
  <text x="256" y="445" font-family="sans-serif" font-weight="800" font-size="34" fill="#fde047" text-anchor="middle" letter-spacing="4">TOSHKENT</text>
</svg>